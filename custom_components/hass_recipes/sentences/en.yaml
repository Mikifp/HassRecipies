language: "en"
intents:
  HassRecipesNextStep:
    data:
      - sentences:
          - "(next|following) step"
          - "what's next"
          - "go to the next step"
          - "next recipe step"
  HassRecipesPreviousStep:
    data:
      - sentences:
          - "(previous|last) step"
          - "go back a step"
          - "go back to the previous step"
  HassRecipesRepeatStep:
    data:
      - sentences:
          - "(repeat|read) (the|this) step"
          - "what's the current step"
          - "what step am I on"
          - "repeat that"
  HassRecipesReadIngredients:
    data:
      - sentences:
          - "(read|list) the ingredients"
          - "what ingredients do I need"
          - "what do I need for [this] recipe"
  HassRecipesTimeLeft:
    data:
      - sentences:
          - "how much time is left"
          - "how long is left on the (timer|timers)"
          - "how long until the (timer|timers) (is|are) done"
  HassRecipesStartTimer:
    data:
      - sentences:
          - "start the (step|recipe) timer"
          - "start the timer for this step"
  HassRecipesPlannedMeal:
    data:
      - sentences:
          - "what's for {meal_slot} [{plan_day}]"
          - "what are we (having|eating) for {meal_slot} [{plan_day}]"
          - "what's (planned|on the menu) for {meal_slot} [{plan_day}]"
  HassRecipesCookPlanned:
    data:
      - sentences:
          - "cook [the planned] {meal_slot} [{plan_day}]"
          - "let's cook {meal_slot} [{plan_day}]"
lists:
  meal_slot:
    values:
      - in: "breakfast"
        out: "breakfast"
      - in: "lunch"
        out: "lunch"
      - in: "(dinner|supper|tea)"
        out: "dinner"
      - in: "(dessert|desserts)"
        out: "dessert"
      - in: "(snack|snacks)"
        out: "snack"
  plan_day:
    values:
      - in: "today"
        out: "today"
      - in: "tonight"
        out: "today"
      - in: "tomorrow"
        out: "tomorrow"
