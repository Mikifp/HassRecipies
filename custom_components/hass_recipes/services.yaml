import_recipe:
  fields:
    url:
      required: true
      example: "https://example.com/best-lasagna"
      selector:
        text:
          type: url

add_to_shopping_list:
  fields:
    recipe:
      required: true
      example: "Pancakes"
      selector:
        text:
    entity_id:
      example: "todo.shopping_list"
      selector:
        entity:
          domain: todo
    scale:
      example: 2
      selector:
        number:
          min: 0.25
          max: 20
          step: 0.25
          mode: box
    servings:
      example: 8
      selector:
        number:
          min: 1
          max: 100
          mode: box
    makes:
      example: 16
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    units:
      default: grams
      selector:
        select:
          options:
            - grams
            - original
