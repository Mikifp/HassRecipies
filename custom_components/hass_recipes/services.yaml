import_recipe:
  fields:
    url:
      required: true
      example: "https://example.com/best-lasagna"
      selector:
        text:
          type: url

add_to_shopping_list:
  fields:
    recipe:
      required: true
      example: "Pancakes"
      selector:
        text:
    entity_id:
      example: "todo.shopping_list"
      selector:
        entity:
          domain: todo
    scale:
      example: 2
      selector:
        number:
          min: 0.25
          max: 20
          step: 0.25
          mode: box
    servings:
      example: 8
      selector:
        number:
          min: 1
          max: 100
          mode: box
    makes:
      example: 16
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    units:
      default: grams
      selector:
        select:
          options:
            - grams
            - original

test_timer_sound:

stop_timer_alarm:

snooze_timer:
  fields:
    seconds:
      default: 120
      example: 120
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
          mode: box
    timer_id:
      required: false

plan_meal:
  fields:
    recipe:
      required: true
      example: Lasagne
      selector:
        text:
    date:
      required: false
      selector:
        date:
    slot:
      default: dinner
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack
    scale:
      required: false
      selector:
        number:
          min: 0.25
          max: 20
          step: 0.25
          mode: box
    servings:
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    note:
      required: false
      selector:
        text:

clear_meal_plan:
  fields:
    start:
      required: false
      selector:
        date:
    end:
      required: false
      selector:
        date:
    slot:
      required: false
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack

add_plan_to_shopping_list:
  fields:
    start:
      required: false
      selector:
        date:
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 60
          mode: box
    entity_id:
      default: todo.shopping_list
      selector:
        entity:
          domain: todo
    units:
      default: grams
      selector:
        select:
          options:
            - grams
            - original
